  <div class="side">
    <div class="panel status-card idle" id="statusCard">
      <svg width="34" height="34" viewBox="0 0 34 34" id="statusIcon">
        <circle cx="17" cy="17" r="15" fill="none" stroke="currentColor" stroke-width="2.5"/>
      </svg>
      <div>
        <div class="status-label">Posture status</div>
        <div class="status-value" id="statusValue">Not started</div>
      </div>
    </div>

    <!-- Posture map canvas -->
    <div class="panel gauge-wrap">
      <canvas id="postureMap" width="200" height="200" style="border-radius:8px; border:1px solid var(--paper-line);"></canvas>
      <div class="gauge-caption" id="gaugeCaption">Posture map — left/right &amp; neck height</div>
    </div>

    <div class="panel">
      <div class="section-title">Today</div>
      <div class="stat-row"><span>Session time</span><span class="val" id="statSession">0m</span></div>
      <div class="stat-row"><span>Time slouching</span><span class="val" id="statSlouch">0m (0%)</span></div>
      <div class="stat-row"><span>Posture nudges</span><span class="val" id="statPostureNudges">0</span></div>
      <div class="stat-row"><span>Break nudges</span><span class="val" id="statBreakNudges">0</span></div>
      <div class="stat-row"><span>Breaks taken</span><span class="val" id="statBreaksTaken">0</span></div>
      <div class="stat-row"><span>Since last break</span><span class="val" id="statSinceBreak">--</span></div>
      <div class="controls" style="margin-top:12px;">
        <button id="exportBtn" class="secondary">Download local backup</button>
      </div>
    </div>

    <!-- Alert feed panel -->
    <div class="panel">
      <div class="section-title">Alert feed</div>
      <div id="alertFeed" style="max-height:160px; overflow-y:auto; font-size:12px; color:var(--ink-soft); line-height:1.4;">
        <div style="color:var(--ink-soft);">No alerts yet</div>
      </div>
    </div>

    <div class="panel">
      <div class="section-title">Sensitivity</div>
      <div class="slider-row">
        <label>Lateral tolerance <span class="v" id="toleranceVal">0.20</span></label>
        <input type="range" id="toleranceSlider" min="0.05" max="0.50" value="0.20" step="0.01" />
      </div>
      <div class="slider-row">
        <label>Compression tolerance <span class="v" id="compressionToleranceVal">0.10</span></label>
        <input type="range" id="compressionToleranceSlider" min="0.02" max="0.30" value="0.10" step="0.01" />
      </div>
      <div class="slider-row">
        <label>Sustained before nudge <span class="v" id="sustainVal">8s</span></label>
        <input type="range" id="sustainSlider" min="3" max="30" value="8" />
      </div>
      <div class="slider-row">
        <label>Break reminder after <span class="v" id="breakVal">60 min</span></label>
        <input type="range" id="breakSlider" min="15" max="180" value="60" />
      </div>
    </div>
  </div>
