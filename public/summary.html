<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Plumb — weekly summary</title>
<style>
  :root {
    --paper: #F1F5F6; --paper-line: #C9D3D6; --ink: #1F2A2E; --ink-soft: #57676C;
    --good: #2C6E8E; --alert: #C98A2C;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { margin: 0; font-family: var(--sans); color: var(--ink); background: var(--paper); min-height: 100vh; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 24px 60px; }
  .eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-soft); }
  h1 { margin: 4px 0 20px; font-size: 26px; }
  .panel { background: #fff; border: 1px solid var(--paper-line); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
  .summary-text { font-size: 16px; line-height: 1.6; }
  .meta { font-size: 12px; color: var(--ink-soft); margin-top: 12px; }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
  .stat { text-align: center; }
  .stat .n { font-family: var(--mono); font-size: 24px; font-weight: 700; }
  .stat .l { font-size: 12px; color: var(--ink-soft); }
  .empty { color: var(--ink-soft); font-size: 14px; }
  a.back { font-size: 13px; color: var(--good); }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Plumb / weekly summary</div>
  <h1>What the last two weeks looked like</h1>
  <div id="content" class="panel"><p class="empty">Loading…</p></div>
  <a class="back" href="./">&larr; Back to the live tracker</a>
</div>

<script>
async function load() {
  const el = document.getElementById('content');
  try {
    const res = await fetch('./data/summary.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('not found');
    const data = await res.json();

    if (!data.summary || !data.stats || data.stats.daysLogged === 0) {
      el.innerHTML = `<p class="empty">No summary yet. Once you've tracked at least one day and it's synced, the weekly summary will appear here after the GitHub Action runs (Mondays, or trigger it manually from the Actions tab).</p>`;
      return;
    }

    const s = data.stats;
    const maxSlouch = Math.max(1, ...s.days.map(d => d.slouchMinutes));
    const bars = s.days.map(d => {
      const h = Math.round((d.slouchMinutes / maxSlouch) * 100);
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;">
        <div style="width:70%;height:${Math.max(h,2)}px;background:var(--alert);border-radius:3px 3px 0 0;align-self:flex-end;"></div>
        <div style="font-size:9px;color:var(--ink-soft);">${d.date.slice(5)}</div>
      </div>`;
    }).join('');

    el.innerHTML = `
      <p class="summary-text">${data.summary}</p>
      <div class="meta">Generated ${new Date(data.generatedAt).toLocaleString()} · based on ${s.daysLogged} logged day(s)</div>
      <hr style="border:none;border-top:1px solid var(--paper-line);margin:18px 0;">
      <div class="stat-grid">
        <div class="stat"><div class="n">${s.totalSessionMinutes}m</div><div class="l">Tracked time</div></div>
        <div class="stat"><div class="n">${s.slouchRatePct}%</div><div class="l">Time slouching</div></div>
        <div class="stat"><div class="n">${s.totalMoveNudges}</div><div class="l">Move nudges</div></div>
      </div>
      <div style="display:flex;align-items:flex-end;gap:4px;margin-top:20px;height:100px;">${bars}</div>
    `;
  } catch (e) {
    el.innerHTML = `<p class="empty">No summary yet. Once you've tracked at least one day and it's synced, the weekly summary will appear here after the GitHub Action runs.</p>`;
  }
}
load();
</script>
</body>
</html>
