name: Weekly pattern analysis

on:
  schedule:
    # 06:00 UTC Friday = 4pm Friday Brisbane (UTC+10, no DST) -- user's own
    # preference, ahead of the weekend rather than Monday morning. The
    # script's own date math is unchanged (always "the 7 days ending
    # yesterday"), so this just moves when that rolling window gets read,
    # not what it covers.
    - cron: '0 6 * * 5'
  workflow_dispatch: {}

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate weekly pattern analysis and goals
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node scripts/generate-weekly-analysis.cjs
