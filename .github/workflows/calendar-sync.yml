name: Sync calendar

on:
  schedule:
    # Hourly. Only meeting TIMES are stored (never titles) -- see
    # scripts/sync-calendar.cjs. GitHub's cron can run several minutes late.
    - cron: '5 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Not saved to package.json: the web app never uses it, only this job.
      - name: Install iCal parser
        run: npm install --no-save --no-audit --no-fund node-ical@0.27.2

      - name: Sync calendar events
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          CALENDAR_ICS_URL: ${{ secrets.CALENDAR_ICS_URL }}
          CALENDAR_USER_ID: Paul
        run: node scripts/sync-calendar.cjs
